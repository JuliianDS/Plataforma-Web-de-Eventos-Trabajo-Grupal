<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Contacto | Plataforma de Eventos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="body-formulario">
  <main class="tarjeta-contacto">
    
    <header class="encabezado-contacto">
      <h2>Contáctanos</h2>
      <p>Envíanos tus dudas o comentarios sobre los eventos y te responderemos a la brevedad.</p>
    </header>

    <form id="form-contacto" class="form-contacto">
      <div class="campo">
        <label for="nombre">Nombre Completo <span class="obligatorio">*</span></label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          placeholder="Tu nombre y apellido" 
          required 
          autocomplete="name"
        >
      </div>

      <div class="campo">
        <label for="email">Correo Electrónico <span class="obligatorio">*</span></label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="ejemplo@correo.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="campo">
        <label for="asunto">Asunto <span class="obligatorio">*</span></label>
        <input 
          type="text" 
          id="asunto" 
          name="asunto" 
          placeholder="Motivo de tu mensaje (ej. Consulta sobre entradas)" 
          required
        >
      </div>

      <div class="campo">
        <label for="mensaje">Mensaje <span class="obligatorio">*</span></label>
        <textarea 
          id="mensaje" 
          name="mensaje" 
          rows="5" 
          placeholder="Escribe detalladamente tu mensaje aquí..." 
          required
        ></textarea>
      </div>

      <button type="submit" class="btn-enviar">Enviar Mensaje</button>
    </form>
  </main>

  <aside>
    <div class="flota wp">
      <a href="https://wa.me/573001234567" target="_blank">
        <img src="../imgs/wp.jpeg" alt="contacto">
      </a>    
    </div>

    <div class="flota pag">
      <a href="./eventos.html">
        <img src="../imgs/flecha-izquierda.png" alt="Eventos">
      </a>    
    </div>

    <div class="c-s">
      <a href="./sesion.html" title="Cerrar sesión">
        <img src="../imgs/apagado.png" alt="Cerrar sesión">
      </a>
    </div>
  </aside>

  <script>
    const formulario = document.getElementById("form-contacto");
    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();
      alert("¡Se envió su información con éxito!");
      formulario.reset();
      window.location.href = "./eventos.html";
    });
  </script>
</body>
</html>
